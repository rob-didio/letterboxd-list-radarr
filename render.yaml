services:
  - type: web
    name: service-web
    env: node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: service-redis
          property: connectionString
      - key: LB_SIDECAR_URL
        fromService:
          type: web
          name: service-sidecar
          property: hostport

  # Python sidecar that performs the Cloudflare bypass via curl_cffi TLS
  # impersonation. The Node web service calls it over the internal network.
  - type: web
    name: service-sidecar
    env: docker
    rootDir: sidecar
    dockerfilePath: ./Dockerfile
    plan: free

  - type: redis
    name: service-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: allkeys-lfu
